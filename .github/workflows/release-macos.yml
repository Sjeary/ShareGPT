name: Release macOS

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release-macos:
    runs-on: macos-14
    env:
      CSC_LINK: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Require official signing and notarization secrets
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"
          test -n "$APPLE_API_KEY_P8"

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix src/renderer-next ci --no-audit --no-fund

      - name: Verify signing boundary
        run: npm run verify:signing-boundaries

      - name: Prepare App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          echo "APPLE_API_KEY=$API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Build, sign, and notarize macOS release
        run: npm run dist:mac:sender

      - name: Verify Developer ID signature and Gatekeeper acceptance
        run: |
          APP_PATH="release_sender/mac-arm64/ShareGPT.app"
          test -d "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dvv "$APP_PATH" 2>&1 | grep -F "Authority=Developer ID Application:"
          codesign -dvv "$APP_PATH" 2>&1 | grep -E "TeamIdentifier=[A-Z0-9]+"
          codesign -dvv "$APP_PATH" 2>&1 | grep -E "flags=.*runtime"
          spctl --assess --type execute --verbose=4 "$APP_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: sharegpt-macos-${{ github.ref_name }}
          path: |
            release_sender/*.dmg
            release_sender/*.zip
          if-no-files-found: error

      - name: Upload signed artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" release_sender/*.dmg release_sender/*.zip --clobber
