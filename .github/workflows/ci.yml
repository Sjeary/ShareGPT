name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, "codex/release-*"]
  pull_request:

# 取消同一分支上过期的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # CI 只做类型检查/测试, 不需要 Electron 二进制, 跳过下载以加速
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装依赖 (主程序 + 渲染层 + 管理端 + 协作服务端)
        run: |
          npm ci --no-audit --no-fund
          npm --prefix src/renderer-next ci --no-audit --no-fund
          npm --prefix admin_console/ui ci --no-audit --no-fund
          npm --prefix collab_server2 ci --no-audit --no-fund

      - name: 主进程语法检查 (node --check)
        run: |
          for f in src/main/*.js; do
            echo "checking $f"
            node --check "$f" || exit 1
          done

      - name: 服务端语法检查
        run: node --check collab_server2/server.js

      - name: 类型检查 — 渲染层
        run: npx tsc -b
        working-directory: src/renderer-next

      - name: 类型检查 — 管理端
        run: npx tsc -b
        working-directory: admin_console/ui

      - name: 构建渲染层
        run: npm run build
        working-directory: src/renderer-next

      - name: 构建管理端
        run: npm run build
        working-directory: admin_console/ui

      - name: 单元测试 (collab_server2)
        run: npm test

      - name: 单元测试 (渲染层)
        run: npm test
        working-directory: src/renderer-next

      - name: 格式检查 (prettier)
        run: npm run format:check

      - name: 代码规范检查 (eslint — Node 端)
        run: npm run lint

      - name: 主进程类型检查 (checkJs)
        run: npm run typecheck:main

      - name: 签名秘密边界检查
        run: npm run verify:signing-boundaries

      - name: 发布身份与版本契约检查
        run: npm run verify:release-contract

      - name: 发布与更新核心逻辑覆盖率
        run: npm run test:release

  windows-package:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安装 Windows 构建与测试依赖
        run: |
          npm ci --no-audit --no-fund
          npm --prefix src/renderer-next ci --no-audit --no-fund
          npm --prefix collab_server2 ci --no-audit --no-fund

      - name: Windows 主进程与发布逻辑回归
        run: |
          npm test
          npm run test:release
          npm run typecheck:main
          npm run verify:release-contract

      - name: 下载并校验固定版本 Windows 二进制
        shell: pwsh
        run: ./scripts/prepare-windows-release-assets.ps1

      - name: 构建并验收 Windows NSIS 安装包
        run: |
          npm run dist:win:installer
          npm run verify:release-win
