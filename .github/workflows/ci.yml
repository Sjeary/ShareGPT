name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# 取消同一分支上过期的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # CI 只做类型检查/测试, 不需要 Electron 二进制, 跳过下载以加速
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装依赖 (主程序 + 渲染层 + 管理端 + 协作服务端)
        run: |
          npm ci --no-audit --no-fund
          npm --prefix src/renderer-next ci --no-audit --no-fund
          npm --prefix admin_console/ui ci --no-audit --no-fund
          npm --prefix collab_server2 ci --no-audit --no-fund

      - name: 主进程语法检查 (node --check)
        run: |
          for f in src/main/*.js; do
            echo "checking $f"
            node --check "$f" || exit 1
          done

      - name: 服务端语法检查
        run: node --check collab_server2/server.js

      - name: 类型检查 — 渲染层
        run: |
          npx tsc -b
          npm run typecheck:test
        working-directory: src/renderer-next

      - name: 渲染层行为测试
        run: npm test
        working-directory: src/renderer-next

      - name: 类型检查 — 管理端
        run: npx tsc -b
        working-directory: admin_console/ui

      - name: 构建渲染层
        run: npm run build
        working-directory: src/renderer-next

      - name: 构建管理端
        run: npm run build
        working-directory: admin_console/ui

      - name: 单元测试 (collab_server2)
        run: npm test

      - name: 格式检查 (prettier)
        run: npm run format:check

      - name: 代码规范检查 (eslint — Node 端)
        run: npm run lint

      - name: 主进程类型检查 (checkJs)
        run: npm run typecheck:main

      - name: 发布身份、签名边界和更新逻辑
        run: |
          npm run verify:signing-boundaries
          npm run verify:release-contract
          npm run test:release

  electron-integration:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安装 Electron 集成测试依赖
        run: |
          npm ci --no-audit --no-fund
          npm --prefix src/renderer-next ci --no-audit --no-fund
          npm --prefix collab_server2 ci --no-audit --no-fund

      - name: AI workspace 生命周期验收
        run: npm run verify:ai-workspace-lifecycle

      - name: macOS 全屏标题栏验收
        run: npm run verify:macos-fullscreen-titlebar

      - name: 聊天输入框布局验收
        run: npm run verify:chat-composer-layout

      - name: Composer 与成功发送统计验收
        run: npm run verify:ai-composer

      - name: 聊天消息菜单边界与键盘验收
        run: npm run verify:chat-message-menu
      - name: Verify chat drafts and reading continuity
        run: npm run verify:chat-interactions
      - name: Verify profile editor layout and saving
        run: npm run verify:profile-editor
      - name: Verify managed proxy editing permissions
        run: npm run verify:managed-proxy-readonly

      - name: 协作登录与客户端/服务端兼容验收
        run: npm run verify:collab-login-compatibility

      - name: 浏览器隐私与资料清理验收
        run: |
          npm run verify:browser-privacy
          npm run verify:browser-privacy-ui

      - name: Verify v1.0.9 legacy Mac packaging and real packaged startup
        env:
          SHAREGPT_RELEASE_TAG: v1.0.9
        run: |
          if [ "$(node -p "require('./package.json').version")" = "1.0.9" ]; then
            npm run prepare:release-mac-assets
            node scripts/build-legacy-release.cjs
            node scripts/verify-packaged-startup.cjs release_sender/mac-arm64/ShareGPT.app/Contents/MacOS/ShareGPT
          fi

  windows-package:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安装 Windows 构建依赖
        run: |
          npm ci --no-audit --no-fund
          npm --prefix src/renderer-next ci --no-audit --no-fund
          npm --prefix collab_server2 ci --no-audit --no-fund

      - name: Windows 发布逻辑回归
        run: |
          npm run test:release
          npm run typecheck:main
          npm run verify:release-contract

      - name: 下载并校验固定版本 Windows 二进制
        shell: pwsh
        run: ./scripts/prepare-windows-release-assets.ps1

      - name: 构建并验收 Windows NSIS 安装包
        run: |
          npm run dist:win:installer
          npm run verify:release-win

      - name: Install and launch the actual NSIS package
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $destination = Join-Path $env:RUNNER_TEMP "ShareGPT-installed"
          $installer = Start-Process -FilePath "release/sharegpt-$version.exe" -ArgumentList @("/S", "/D=$destination") -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "NSIS installation failed" }
          node scripts/verify-packaged-startup.cjs "$destination/sharegpt.exe"
          if ($LASTEXITCODE -ne 0) { throw "Installed app startup failed" }
